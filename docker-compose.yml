name: hooplytics

services:
  postgres:
    image: postgres:16-alpine
    container_name: hooplytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hooplytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run make setup)}
      POSTGRES_DB: ${POSTGRES_DB:-hooplytics}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - hooplytics_pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hooplytics} -d ${POSTGRES_DB:-hooplytics}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hooplytics_pgdata:
